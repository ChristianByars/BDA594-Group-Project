<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>California Socioeconomic Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mapbox/mapbox-gl-draw@1.5.0/dist/mapbox-gl-draw.css">
  <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="mobileOverlay" class="mobile-overlay"></div><aside class="sidebar"><button id="closeSidebarBtn" class="close-sidebar-btn" type="button" aria-label="Close filters">&times;</button>
      <div class="brand">
        <div class="eyebrow">California Data Dashboard</div>
        <h1>California Zip Code Explorer</h1>
        <p>Explore California socioeconomic data by zip code.</p>

        <button
        id="themeToggle"
        class="theme-toggle secondary"
        type="button"
        aria-pressed="false"
      >
        <span id="themeToggleText">Dark mode</span>
      </button>
    </div>

            <form id="filters" class="filter-form">
        <label>
          Variable
          <select id="variableSelect">
            <option value="Total_Population">Total Population</option>
            <option value="Median_Household_Income">Median Household Income</option>
            <option value="Median_Home_Value">Median Home Value</option>
            <option value="Below_Poverty_Level">Below Poverty Level</option>
            <option value="Poverty_Rate">Poverty Rate</option>
          </select>
        </label>
        <button type="submit">Apply filter</button>
      </form>
      <div id="status" class="status">Loading data…</div>
    </aside>

    <main class="dashboard-container">
      <section class="header-card">
        <div class="header-titles"><button id="mobileFilterBtn" class="mobile-filter-btn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg> Filters</button><div class="header-text"><div class="eyebrow">California Data Dashboard</div>
          <h2 id="dashboardTitle">Geographic Dashboard</h2><div id="dashboardMeta" class="meta"></div></div></div>

        

        
      </section>

      <section id="mapSection" class="section-card">
        <h2>Map</h2>
        
        <div id="mapChart" class="chart map-chart"></div>
        <div id="tractMap" class="chart map-chart hidden"></div>
      </section>

      

      

      
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
