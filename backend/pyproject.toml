[project]
name = "crime-pipeline"
version = "1.0.0"
description = "Builds a standardized LA / San Diego / San Francisco crime database from the cities' raw open-data exports."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bad Data Analytics (BDA 594)" }]
dependencies = ["pandas>=2.2", "shapely>=2.0", "certifi"]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebook = ["ipykernel", "jupyter"]

[project.scripts]
crime-pipeline = "crime_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/crime_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
