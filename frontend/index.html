<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>California City Crime Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="mobileOverlay" class="mobile-overlay"></div><aside id="sidebar" class="sidebar"><button id="closeSidebarBtn" class="close-sidebar-btn" type="button" aria-label="Close filters">&times;</button>
      <div class="brand">
        <div class="eyebrow">California Crime Dashboard</div>
        <h1>City Crime Explorer</h1>
        <p>Offenses in Los Angeles, San Diego and San Francisco by ZIP code or police area, next to ZIP socioeconomic data.</p>

        <button
        id="themeToggle"
        class="theme-toggle secondary"
        type="button"
        aria-pressed="false"
      >
        <span id="themeToggleText">Dark mode</span>
      </button>
    </div>

      <form id="filters" class="filter-form">
        <label>
          City
          <select id="citySelect"></select>
        </label>
        <label>
          Crime group
          <select id="groupSelect">
            <option value="">All crime groups</option>
          </select>
        </label>
        <label>
          From
          <select id="startMonth"></select>
        </label>
        <label>
          To
          <select id="endMonth"></select>
        </label>
        <label id="measureField">
          Map shows
          <select id="measureSelect">
            <option value="count">Offense count</option>
            <option value="rate">Offenses per 1,000 residents</option>
          </select>
        </label>
      </form>
      <div id="status" class="status">Loading data…</div>
    </aside>

    <main class="dashboard-container">
      <section class="header-card">
        <div class="header-titles"><button id="mobileFilterBtn" class="mobile-filter-btn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg> Filters</button><div class="header-text"><div class="eyebrow">California Crime Dashboard</div>
          <h2 id="dashboardTitle">Crime map</h2><div id="dashboardMeta" class="meta"></div></div></div>
      </section>

      <section id="mapSection" class="section-card">
        <h2 id="mapTitle">Map</h2>
        <div id="mapNote" class="subtle"></div>
        <div id="mapChart" class="chart map-chart"></div>
      </section>

      <section id="trendSection" class="section-card">
        <h2>Monthly trend</h2>
        <div id="trendChart" class="chart"></div>
      </section>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
